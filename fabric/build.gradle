plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'com.gradleup.shadow' version '9.3.1'
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven { url "https://jitpack.io" }

    maven {
        name = "MoulConfig"
        url = "https://maven.notenoughupdates.org/releases/"
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

configurations {
    shadowModImpl
    modImplementation.extendsFrom(shadowModImpl)
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")
    modImplementation "com.github.Chocohead:Fabric-ASM:v${project.fabric_asm_version}"
    include "com.github.Chocohead:Fabric-ASM:v${project.fabric_asm_version}"
    shadowModImpl(libs.moulconfig) {
        exclude group: "org.jetbrains.kotlin"
        exclude group: "org.jetbrains.kotlinx"
    }
    include(libs.moulconfig)
}

tasks.shadowJar {
    configurations = [project.configurations.shadowModImpl]
    relocate "io.github.notenoughupdates.moulconfig", "sircow.preservedinferno.deps.moulconfig"
    archiveClassifier = 'shadow'
    exclude "META-INF/versions/**"
    mergeServiceFiles()
}

remapJar {
    dependsOn tasks.shadowJar
    inputFile = tasks.shadowJar.archiveFile
    archiveClassifier = ""
}

tasks.jar {
    archiveClassifier = "nodeps"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
loom.remapConfigurations.configureEach {
    configurations.named(it.name) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
