plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = "MoulConfig"
        url = "https://maven.notenoughupdates.org/releases/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    compileOnly "maven.modrinth:better-advancements:${betteradvancements_version}-fabric,${minecraft_version}"
    include "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "maven.modrinth:lootr:${lootr_version}-fabric,${minecraft_version}"
    implementation "maven.modrinth:modmenu:${project.modmenu_version}"
    compileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    implementation(libs.moulconfig)
    include(libs.moulconfig)
}

tasks.jar {
    archiveClassifier.set("")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            programArgs "--tweakClass", "io.github.notenoughupdates.moulconfig.tweaker.DevelopmentResourceTweaker"
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}

sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}